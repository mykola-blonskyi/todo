services:
  postgres-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Host port 5437: hub's docker-compose.dev.yml already uses 5435 on this
      # Mac, and 5436 is reserved for this repo's own docker-compose.test.yml.
      - '5437:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
