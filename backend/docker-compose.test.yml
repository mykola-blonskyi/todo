services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todolist_test
      POSTGRES_PASSWORD: todolist_test
      POSTGRES_DB: todolist_test
    ports:
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todolist_test']
      interval: 5s
      timeout: 5s
      retries: 10
