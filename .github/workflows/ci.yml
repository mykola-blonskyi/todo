name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend lint:check

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend format:check

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend exec tsc --noEmit

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend test

  backend-test-e2e:
    runs-on: ubuntu-latest
    env:
      # searchShareCandidates (backend/src/hub/hub-client.service.ts) builds a
      # URL from these at request time even though the e2e specs always mock
      # global.fetch - without them, new URL() throws before the mock is ever
      # reached. Values are dummies, never dereferenced over the network.
      HUB_URL: http://hub.test
      PROJECT_SLUG: todolist-ci
      # AES-256-GCM key for GoogleCalendarConnection token encryption
      # (backend/src/google-calendar/token-encryption.ts) - only needs to be
      # a syntactically valid 32-byte base64 key for tests to run, never a
      # real per-environment secret (CI never talks to real Google Calendar
      # data).
      TOKEN_ENCRYPTION_KEY: y6pTgWQY7Sl4qAIAYKKubuJjYOXMxr0yfPWWBHNCsRQ=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      # pretest:e2e/posttest:e2e manage docker-compose.test.yml (a real
      # Postgres) - migrations run in Jest's globalSetup, tables truncated
      # between tests, matching the hub's own integration-test conventions.
      - run: pnpm --filter backend test:e2e

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint

  frontend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend format:check

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next.js's route-type validator files under .next/types are generated by
      # next build/dev - on a fresh checkout that dir doesn't exist yet, so
      # tsconfig's ".next/types/**/*.ts" include glob simply matches nothing.
      # Don't run `next build` first here just to populate it - see ADR-010,
      # unconditional-but-minimal checks, no speculative extra steps.
      - run: pnpm --filter frontend exec tsc --noEmit

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend test

  e2e:
    runs-on: ubuntu-latest
    # Builds and boots both apps against a real Postgres, far slower than the
    # static checks above - not worth spending on a tree that doesn't compile.
    needs:
      - backend-typecheck
      - frontend-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # A trace you cannot retrieve is not evidence.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    # Only after every check above is green, and only for real pushes to
    # main (never PRs) - Coolify itself builds the images from
    # docker-compose.yml (issue #55), this job just tells it to.
    needs:
      - backend-lint
      - backend-format
      - backend-typecheck
      - backend-test
      - backend-test-e2e
      - frontend-lint
      - frontend-format
      - frontend-typecheck
      - frontend-test
      - e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            echo "COOLIFY_WEBHOOK_URL not set yet (todolist isn't registered in Coolify - see docs/TODO.md) - skipping."
            exit 0
          fi
          # Coolify's /deploy route (routes/api.php) explicitly rejects GET
          # (routes it to a "use POST instead" handler) - only POST triggers
          # a real deployment, despite what some of Coolify's own docs show.
          curl --fail --request POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"
