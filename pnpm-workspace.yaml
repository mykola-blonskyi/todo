packages:
  - backend
  - frontend

# Lets `pnpm deploy` (used by backend/Dockerfile) build a self-contained
# node_modules for a single workspace package.
injectWorkspacePackages: true

allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  sharp: true
  unrs-resolver: false
