# Coolify deployment (see docs/decisions.md ADR-002/ADR-003, issue #55).
#
# No `networks:` block on purpose - Coolify manages one network per stack
# itself, and a custom network here causes Traefik container-IP issues (see
# Coolify's own docker-compose guidance). To reach the shared VPS Postgres
# instance (ADR-002, host alias `postgres`), enable this stack's "Connect to
# Predefined Network" toggle in the Coolify UI.
#
# Every ${VAR} below is supplied by Coolify's own per-resource environment
# variable panel at deploy time - never a committed .env file. See
# backend/.env.example and frontend/.env.example for what each one means.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HUB_URL: ${HUB_URL}
      PROJECT_SLUG: ${PROJECT_SLUG}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      PORT: 4000
    restart: unless-stopped
    # No ports/domain: stays private on Coolify's network (ADR-003 - the
    # backend is internal-only). The frontend reaches it at
    # http://backend:4000/graphql over that network.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      APP_URL: ${APP_URL}
      HUB_URL: ${HUB_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BACKEND_URL: http://backend:4000/graphql
    depends_on:
      - backend
    restart: unless-stopped
    # Public domain is assigned via Coolify's own per-service domain config,
    # not declared here - Coolify's proxy picks up the Dockerfile's EXPOSE.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
